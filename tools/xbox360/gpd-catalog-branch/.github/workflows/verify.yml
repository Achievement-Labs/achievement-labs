name: Verify GPD catalog
on:
  push:
    branches: [gpd-catalog]
  pull_request:
    branches: [gpd-catalog]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          sparse-checkout: tools/xbox360
          persist-credentials: false
      - run: node main/tools/xbox360/gpd-catalog.cjs verify catalog
