name: Event catalog checks
on:
  pull_request:
    paths:
      - 'Events/**'
      - 'src/AchievementLabs.App/Events/**'
      - 'src/AchievementLabs.Core/**'
      - 'tools/event_catalog.py'
      - 'tools/test_event_catalog.py'
      - 'tools/EventCatalogChecks/**'
      - 'tools/CompressEvents/**'
      - 'tools/UpdaterChecks/**'
      - 'src/AchievementLabs.Desktop/**'
      - 'tests/AchievementLabs.Enhancements.Tests/ReleaseUiChecks.cs'
      - 'tools/Build-Release.ps1'
      - 'src/AchievementLabs.Desktop/Workflows/StatsEditorViewModel.cs'
      - 'tests/AchievementLabs.Enhancements.Tests/BundledStatsChecks.cs'
      - 'tests/AchievementLabs.Enhancements.Tests/Program.cs'
      - 'tools/mobile/**'
      - 'tests/AchievementLabs.Enhancements.Tests/UpstreamEventCatalogueTests.cs'
      - '.github/workflows/event-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p test_event_catalog.py
      - run: python -m unittest discover -s tools/mobile -p test_publish_events.py
      - run: dotnet run --project tools/EventCatalogChecks -p:NuGetAudit=false -- --render Events
      - run: dotnet run --project tools/CompressEvents -p:NuGetAudit=false -- --self-test
      - run: dotnet run --project tools/EventCatalogChecks -c Release -p:NuGetAudit=false -- --render-bundled
      - run: dotnet run --project tools/EventCatalogChecks -c Release -p:NuGetAudit=false -- --official-release Events
      - run: dotnet run --project tools/CompressEvents -c Release -p:NuGetAudit=false -- --verify src/AchievementLabs.Core/bin/Release/net9.0-windows/AchievementLabs.Core.dll src/AchievementLabs.App/Events
      - run: dotnet run --project tests/AchievementLabs.Enhancements.Tests -c Release -p:NuGetAudit=false -- --bundled-stats
      - run: dotnet run --project tools/UpdaterChecks -c Release -p:NuGetAudit=false
      - run: dotnet run --project tests/AchievementLabs.Enhancements.Tests -c Release -p:NuGetAudit=false -- --release-ui artifacts/release-ui
