<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Xbox 360</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Xbox 360</h1><button id="import">Open exported profile</button><button id="export" disabled>Export signed profile</button><button id="backup" disabled>Export original backup</button></header><p id="status" role="status">Open your console/USB profile export. Edits use a private copy.</p><main id="workspace" hidden><section class="glass"><div class="toolbar"><input id="gameSearch" placeholder="Search 360 games" aria-label="Search games"><select id="gameSort" aria-label="Sort games"><option value="az">A–Z</option><option value="za">Z–A</option><option value="recent">Last played</option><option value="completion">Completion</option></select></div><div id="games"></div></section><section class="glass"><div id="gameHeader"></div><div class="toolbar"><select id="filter" aria-label="Achievement filter"><option value="locked">Locked only</option><option value="all">All achievements</option><option value="unlocked">Unlocked only</option></select><select id="sort" aria-label="Achievement sort"><option value="id">Achievement ID</option><option value="az">A–Z</option><option value="za">Z–A</option><option value="score">Gamerscore</option><option value="date">Unlock date</option></select><button id="select">Select locked</button><button id="clear">Clear selection</button></div><div id="achievements"></div></section><section class="glass controls"><h2>Unlock selected</h2><label>Unlock date<select id="mode"><option value="offline">Offline (no date)</option><option value="now">Online (now)</option><option value="custom">Custom dates</option><option value="xbox">Xbox ref
