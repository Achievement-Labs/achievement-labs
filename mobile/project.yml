name: AchievementLabsMobile
options:
  bundleIdPrefix: org.achievementlabs
  deploymentTarget:
    iOS: "17.0"
packages:
  LabsMobileCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.12.11"
    CURRENT_PROJECT_VERSION: "29"
targets:
  AchievementLabsMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared360
        type: folder
        buildPhase: resources
      - path: Catalogue
        type: folder
        buildPhase: resources
    info:
      path: GeneratedInfo.plist
      properties:
        UIBackgroundModes: [processing, audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: Labs sessions
            CFBundleURLSchemes: [achievementlabs]
        NSAppTransportSecurity:
          NSExceptionDomains:
            v20.events.data.microsoft.com:
              NSIncludesSubdomains: false
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.2
              NSExceptionRequiresForwardSecrecy: true
        BGTaskSchedulerPermittedIdentifiers: [org.achievementlabs.mobile.queue.*]
    dependencies:
      - package: LabsMobileCore
      - target: LabsSessionWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.achievementlabs.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan your own Achievement Labs sign-in, event-token and saved queue QR codes.
        INFOPLIST_KEY_CFBundleDisplayName: Achievement Labs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  LabsSessionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/SessionActivityAttributes.swift
      - path: App/ActiveSessionStyle.swift
    info:
      path: GeneratedWidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.achievementlabs.mobile.sessionwidget
        INFOPLIST_KEY_CFBundleDisplayName: Labs session
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
schemes:
  AchievementLabsMobile:
    build:
      targets:
        AchievementLabsMobile: all
